<!DOCTYPE html>
<html lang="en">
<script>
  document.addEventListener("DOMContentLoaded", function() {
    document.body.style.transform = "scale(2.1)";
    document.body.style.transformOrigin = "0 0";
    document.body.style.width = "46.77%";  // Adjusted for correct scaling
    document.body.style.height = "76.67%"; // Adjusted for correct scaling
    document.body.style.overflow = "auto"; // Allow scrolling
  });
</script>
<head>
    <meta charset="UTF-8">
    <title>Necro's Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1;
            background-color: #0a0a0a;
            color: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        
        .button-container {
            display: grid;
            gap: 1rem;
            width: 100%;
        }
        
        .btn {
            display: block;
            padding: 1rem;
            border-radius: 2px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary {
            background-color: #3a5c8a;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2d4a72;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #333;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
        
        .btn-tertiary {
            background-color: #4a3a5a;
            color: white;
        }
        
        .btn-tertiary:hover {
            background-color: #3a2a4a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Necro's Hub</h1>
        
        <div class="button-container">
            <a href="photo_work" class="btn btn-primary">Photo Sessions</a>
            <a href="index_main" class="btn btn-secondary">Social Media</a>
            <a href="https://asubank.xyz" target="_blank" class="btn btn-tertiary">ASU Test Banks</a>
        </div>
    </div>
</body>
</html>
