<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Necro's Hub</title>
<style>
    :root {
        --bg-color: #0a0a0a;
        --text-color: #f0f0f0;
        --primary-btn: #ff5722;
        --primary-hover: #e04d1e;
        --secondary-btn: #333;
        --secondary-hover: #444;
        --tertiary-btn: #4a3a5a;
        --tertiary-hover: #3a2a4a;
        --accent-color: #ffd700;
    }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        font-size: 200%;
    }
    .container {
        width: 100%;
        max-width: 800px;
    }
    h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        letter-spacing: -1px;
    }
    .sale-banner {
        background: var(--primary-btn);
        color: white;
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 2rem;
        font-size: 2rem;
        font-weight: bold;
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    .button-container {
        display: grid;
        gap: 1.5rem;
        margin-top: 2rem;
    }
    .btn {
        display: inline-block;
        padding: 1.5rem 2rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.8rem;
        transition: all 0.3s ease;
    }
    .btn-primary {
        background-color: var(--primary-btn);
        color: white;
    }
    .btn-primary:hover {
        background-color: var(--primary-hover);
        transform: translateY(-3px);
    }
    .btn-secondary {
        background-color: var(--secondary-btn);
        color: white;
    }
    .btn-secondary:hover {
        background-color: var(--secondary-hover);
        transform: translateY(-3px);
    }
    .btn-tertiary {
        background-color: var(--tertiary-btn);
        color: white;
    }
    .btn-tertiary:hover {
        background-color: var(--tertiary-hover);
        transform: translateY(-3px);
    }
</style>
</head>
<body>
<div class="container">
    <h1>Necro's Hub</h1>
    <div class="sale-banner">
       50% OFF Photo Sessions – Limited Time Only!
    </div>
    <div class="button-container">
        <a href="photo_work" class="btn btn-primary">Book Photo Sessions</a>
        <a href="main_index" class="btn btn-secondary">Social Media</a>
        <a href="https://asubank.xyz" target="_blank" class="btn btn-tertiary">ASU Test Banks</a>
    </div>
</div>
</body>
</html>
