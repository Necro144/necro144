<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModRiotGaming Server List</title>
    <link rel="icon" href="cs.png" type="image/x-icon">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
    
    <style>
        :root {
            --primary-color: #00ff9d;
            --secondary-color: #bd00ff;
            --background-color: #0d0d0d;
            --card-color: rgba(20, 20, 20, 0.9);
            --text-color: #f0f0f0;
            --text-muted: #b0b0b0;
            --border-radius: 16px;
            --box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 255, 157, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(189, 0, 255, 0.1) 0%, transparent 50%);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            background: var(--card-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(40, 40, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }
        
        .back-button:hover {
            background: rgba(60, 60, 60, 0.7);
            transform: translateX(-3px);
        }
        
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 30px;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 15px;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
        }
        
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: separate;
            border-spacing: 0 12px;
        }
        
        th {
            background: linear-gradient(to right, rgba(0, 255, 157, 0.2), rgba(189, 0, 255, 0.2));
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px;
            text-align: left;
            border: none;
        }
        
        tr {
            background-color: rgba(40, 40, 40, 0.6);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        tr::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            transition: var(--transition);
        }
        
        td {
            padding: 15px;
            text-align: left;
            border: none;
            position: relative;
        }
        
        .server-name {
            font-weight: 500;
            color: var(--text-color);
        }
        
        .server-ip {
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
        }
        
        .join-button {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-block;
            text-decoration: none;
        }
        
        .join-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 157, 0.3);
        }
        
        .info {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            th, td {
                padding: 12px 10px;
                font-size: 0.9rem;
            }
            
            .join-button {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                margin-top: 20px;
            }
            
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            
            .back-button {
                top: 15px;
                left: 15px;
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button" title="Back to Home">←</a>
        
        <h1>ModRiotGaming Server List</h1>
        
        <table>
            <tr>
                <th>Server Name</th>
                <th>IP Address</th>
                <th>Join</th>
            </tr>
            <tr>
                <td class="server-name">[NS] Necro's Server</td>
                <td class="server-ip">173.199.107.158:27055</td>
                <td><a href="steam://connect/173.199.107.158:27055" class="join-button">Join</a></td>
            </tr>
            <tr>
                <td class="server-name">Sven Co-op Server</td>
                <td class="server-ip">45.90.13.47:27015</td>
                <td><a href="steam://connect/45.90.13.47:27015" class="join-button">Join</a></td>
            </tr>
        </table>

        <div class="info">
            <p>To join a server, click the "Join" button or copy the IP address and paste it into the game console.</p>
        </div>
    </div>
    
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Block common inspection shortcuts
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                (e.ctrlKey && e.shiftKey && e.key === 'J') || 
                (e.ctrlKey && e.shiftKey && e.key === 'C') ||
                (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });

        // Disable text selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        // Disable drag-and-drop
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
