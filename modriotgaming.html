<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#04070a">
    <meta name="color-scheme" content="dark">
    <title>servers.log // ModRiotGaming</title>
    <link rel="icon" href="cs.png" type="image/x-icon">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #04070a;
            --bg-deep: #010302;
            --panel: rgba(8, 16, 18, 0.85);
            --line: rgba(46, 230, 208, 0.18);
            --cyan: #2ee6d0;
            --cyan-soft: #7dfbe9;
            --magenta: #ff3ea5;
            --amber: #ffb703;
            --text: #d9f6f0;
            --muted: #5f8b85;
            --radius: 14px;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --pixel: 'VT323', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: -2;
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(rgba(46, 230, 208, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 230, 208, 0.06) 1px, transparent 1px);
            background-size: 34px 34px;
        }
        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(circle at 20% 15%, rgba(46, 230, 208, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(255, 62, 165, 0.08) 0%, transparent 45%);
        }
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 45; pointer-events: none;
            background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 4px);
            mix-blend-mode: overlay;
        }

        .term {
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius);
            border: 1px solid var(--line);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(46,230,208,0.05);
            position: relative;
            overflow: hidden;
        }

        .term-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.35);
            border-bottom: 1px solid var(--line);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.r { background: #ff5f56; }
        .dot.y { background: #ffbd2e; }
        .dot.g { background: #27c93f; }
        .term-title { margin-left: 10px; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.5px; }
        .back-button {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--line);
            color: var(--cyan);
            border-radius: 6px;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }
        .back-button:hover { background: rgba(46,230,208,0.1); }

        .term-body { padding: 28px 26px 32px; text-align: center; }

        .terminal-path { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; text-align: left; }
        .terminal-path .ps1 { color: var(--cyan); }

        h1 {
            font-family: var(--pixel);
            font-weight: 400;
            font-size: clamp(1.8rem, 6vw, 2.3rem);
            letter-spacing: 1px;
            color: var(--cyan-soft);
            text-shadow: 0 0 10px rgba(46,230,208,0.45);
            margin-bottom: 22px;
            position: relative;
            display: inline-block;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 2px;
            background: linear-gradient(to right, var(--cyan), var(--magenta));
            border-radius: 3px;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
            text-align: left;
        }

        .server-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--line);
            border-left: 3px solid var(--cyan);
            border-radius: 8px;
            padding: 14px 16px;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
        }
        .server-row:hover {
            border-color: var(--cyan);
            background: rgba(46,230,208,0.05);
            transform: translateX(2px);
        }

        .server-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }
        .server-name::before { content: '> '; color: var(--cyan); }

        .server-ip {
            color: var(--muted);
            font-size: 0.82rem;
            font-family: var(--mono);
        }

        .join-button {
            background: linear-gradient(to right, var(--cyan), var(--magenta));
            color: #04070a;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }
        .join-button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(46,230,208,0.25); }

        .info {
            margin-top: 28px;
            font-size: 0.82rem;
            color: var(--muted);
            font-style: italic;
        }

        @media (max-width: 768px) {
            .term-body { padding: 22px 18px 26px; }
        }
        @media (max-width: 560px) {
            .server-row {
                grid-template-columns: 1fr;
                text-align: left;
                gap: 6px;
            }
            .join-button { justify-self: start; margin-top: 6px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="term">
        <div class="term-bar">
            <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            <span class="term-title">necro@root:~/servers</span>
            <a href="index" class="back-button" title="Back to Home">←</a>
        </div>
        <div class="term-body">
            <p class="terminal-path"><span class="ps1">necro@root</span>:~$ cat servers.log</p>
            <h1>ModRiotGaming Server List</h1>

            <div class="server-list">
                <div class="server-row">
                    <span class="server-name">[NS] Necro's Server</span>
                    <span class="server-ip">173.199.107.158:27055</span>
                    <a href="steam://connect/173.199.107.158:27055" class="join-button">Join</a>
                </div>
                <div class="server-row">
                    <span class="server-name">Sven Co-op Server</span>
                    <span class="server-ip">45.90.13.47:27015</span>
                    <a href="steam://connect/45.90.13.47:27015" class="join-button">Join</a>
                </div>
            </div>

            <p class="info">To join a server, click the "Join" button or copy the IP address and paste it into the game console..</p>
        </div>
    </div>

    <script>
        // Content-protection flavor (non-blocking, matches rest of site)
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            const blocked = (e.key === 'F12') ||
                ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u');
            if (blocked) e.preventDefault();
        });
        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>
</html>
