<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin List</title>
<link rel="icon" href="counter-strike-icon-1.jpg">
<script>
  // Disable right-click context menu
  window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Disable Ctrl+U shortcut
  window.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'u') {
      e.preventDefault();
    }
  });

  // Disable all keyboard shortcuts
  window.addEventListener('keydown', function(e) {
    e.preventDefault();
  });
</script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a202c;
      color: #f7fafc;
      padding: 24px;
      margin: 0;
    }
    .min-h-screen {
      min-height: 100vh;
    }
    .max-w-2xl {
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
    }
    .space-y-12 > * + * {
      margin-top: 3rem;
    }
    .bg-gray-800 {
      background-color: #2d3748;
    }
    .rounded-lg {
      border-radius: 0.5rem;
    }
    .p-8 {
      padding: 2rem;
    }
    .shadow-lg {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .border {
      border-width: 1px;
    }
    .border-cyan-500 {
      border-color: #00bcd4;
    }
    .border-purple-500 {
      border-color: #9c27b0;
    }
    .relative {
      position: relative;
    }
    .overflow-hidden {
      overflow: hidden;
    }
    .absolute {
      position: absolute;
    }
    .inset-0 {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }
    .bg-cyan-500 {
      background-color: #00bcd4;
    }
    .bg-purple-500 {
      background-color: #9c27b0;
    }
    .opacity-10 {
      opacity: 0.1;
    }
    .animate-pulse {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    .text-3xl {
      font-size: 1.875rem;
    }
    .font-bold {
      font-weight: 700;
    }
    .mb-6 {
      margin-bottom: 1.5rem;
    }
    .text-cyan-400 {
      color: #4dd0e1;
    }
    .text-purple-400 {
      color: #b388ff;
    }
    .flex {
      display: flex;
    }
    .items-center {
      align-items: center;
    }
    .justify-center {
      justify-content: center;
    }
    .text-xl {
      font-size: 1.25rem;
    }
    .font-semibold {
      font-weight: 600;
    }
    .glow-text-cyan {
      color: #4dd0e1;
      animation: glow 2s ease-in-out infinite;
    }
    .glow-text-purple {
      color: #b388ff;
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow {
      0% {
        text-shadow: 0 0 5px currentColor;
      }
      50% {
        text-shadow: 0 0 20px currentColor, 0 0 30px currentColor;
      }
      100% {
        text-shadow: 0 0 5px currentColor;
      }
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-gray-900 text-gray-100 font-sans p-6">
    <div class="max-w-2xl mx-auto space-y-12">
      <!-- Admin List Section -->
      <div class="bg-gray-800 rounded-lg p-8 shadow-lg border border-cyan-500 relative overflow-hidden">
        <div class="absolute inset-0 bg-cyan-500 opacity-10 animate-pulse"></div>
        <h2 class="text-3xl font-bold mb-6 text-cyan-400 relative z-10 flex items-center justify-center">
          <!-- Shield icon placeholder -->
          <span class="mr-2">🛡️</span> Admin List
        </h2>
        <ul class="space-y-4 relative z-10">
          <li class="text-xl font-semibold glow-text-cyan">|NS| Néć[Ř]ø /A/</li>
          <li class="text-xl font-semibold glow-text-cyan">|NS| Cyra</li>
          <li class="text-xl font-semibold glow-text-cyan">|NS| Mar.</li>
        </ul>
      </div>

      <!-- VIPs List Section -->
      <div class="bg-gray-800 rounded-lg p-8 shadow-lg border border-purple-500 relative overflow-hidden">
        <div class="absolute inset-0 bg-purple-500 opacity-10 animate-pulse"></div>
        <h2 class="text-3xl font-bold mb-6 text-purple-400 relative z-10 flex items-center justify-center">
          <!-- Shield icon placeholder -->
          <span class="mr-2">🛡️</span> VIPs List
        </h2>
        <ul class="space-y-4 relative z-10">
          <li class="text-xl font-semibold glow-text-purple">None. Please apply!</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
