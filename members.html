<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#04070a">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/png" href="lambda.png">
    <title>members.log // Community Roster</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #04070a;
            --bg-deep: #010302;
            --panel: rgba(8, 16, 18, 0.85);
            --line: rgba(46, 230, 208, 0.18);
            --cyan: #2ee6d0;
            --cyan-soft: #7dfbe9;
            --magenta: #ff3ea5;
            --amber: #ffb703;
            --blue: #4dabf7;
            --grey: #8a9a97;
            --text: #d9f6f0;
            --muted: #5f8b85;
            --radius: 12px;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --pixel: 'VT323', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: -2;
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(rgba(46, 230, 208, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 230, 208, 0.06) 1px, transparent 1px);
            background-size: 34px 34px;
        }
        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(circle at 15% 8%, rgba(46, 230, 208, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 95%, rgba(255, 62, 165, 0.08) 0%, transparent 45%);
        }
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 45; pointer-events: none;
            background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 4px);
            mix-blend-mode: overlay;
        }

        header {
            position: relative;
            padding: 2.2rem 20px 1.6rem;
            text-align: center;
            border-bottom: 1px solid var(--line);
            background: rgba(4, 7, 10, 0.6);
            backdrop-filter: blur(10px);
        }

        .back-button {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        .back-button:hover { background: rgba(46,230,208,0.1); border-color: var(--cyan); }

        .terminal-path { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
        .terminal-path .ps1 { color: var(--cyan); }

        h1 {
            font-family: var(--pixel);
            font-weight: 400;
            font-size: clamp(1.8rem, 6vw, 2.3rem);
            letter-spacing: 1px;
            color: var(--cyan-soft);
            text-shadow: 0 0 10px rgba(46,230,208,0.45);
        }

        .legend {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px;
            max-width: 800px; margin: 1.2rem auto 0;
            font-size: 0.72rem;
        }
        .legend span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
        .legend .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

        .table-wrap {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.2rem;
        }

        .section-title {
            font-family: var(--pixel);
            font-weight: 400;
            font-size: 1.5rem;
            color: var(--cyan-soft);
            letter-spacing: 0.5px;
            margin: 2rem 0 1rem;
            text-align: left;
        }
        .section-title::before { content: '> '; color: var(--cyan); }
        .table-wrap .section-title:first-child { margin-top: 0; }

        .roster-table-container {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        table { width: 100%; border-collapse: collapse; min-width: 640px; }

        thead th {
            background: rgba(46, 230, 208, 0.06);
            color: var(--cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.72rem;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        tbody td {
            padding: 12px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(46, 230, 208, 0.08);
            white-space: nowrap;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(46, 230, 208, 0.04); }

        .member-name { font-weight: 600; color: var(--text); }
        .member-name::before { content: '/ '; color: var(--muted); }
        .member-since { color: var(--muted); font-size: 0.8rem; }
        .member-country { color: var(--cyan-soft); }

        .rank-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid currentColor;
        }

        footer {
            text-align: center;
            padding: 2rem 20px 0;
            color: var(--muted);
            font-size: 0.75rem;
        }

        @media (max-width: 640px) {
            .back-button { position: static; transform: none; margin-bottom: 12px; display: inline-block; }
            header { text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <header>
        <a href="index" class="back-button">&lt; back</a>
        <p class="terminal-path"><span class="ps1">necro@root</span>:~$ cat members.log</p>
        <h1>Community Roster</h1>
        <div class="legend">
            <span><i class="swatch" style="background:var(--amber)"></i>Owner</span>
            <span><i class="swatch" style="background:var(--magenta)"></i>Banned / Inactive</span>
            <span><i class="swatch" style="background:var(--cyan)"></i>Support / Active</span>
            <span><i class="swatch" style="background:var(--blue)"></i>Unbanned</span>
            <span><i class="swatch" style="background:var(--grey)"></i>Retired</span>
            <span><i class="swatch" style="background:var(--cyan-soft)"></i>Barely Active</span>
        </div>
    </header>

    <div class="table-wrap">
        <h2 class="section-title">Active Roster</h2>
        <div class="roster-table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Member Since</th>
                        <th>Country</th>
                        <th>Rank</th>
                    </tr>
                </thead>
                <tbody id="membersBody"></tbody>
            </table>
        </div>

        <h2 class="section-title">Banned Users</h2>
        <div class="roster-table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Banned Since</th>
                        <th>Country</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bannedBody"></tbody>
            </table>
        </div>
    </div>

    <footer>© Necro's Hub — Community Roster Archive</footer>

    <script>
        const RANK_COLORS = {
            amber: 'var(--amber)',
            magenta: 'var(--magenta)',
            cyan: 'var(--cyan)',
            blue: 'var(--blue)',
            grey: 'var(--grey)',
            cyansoft: 'var(--cyan-soft)'
        };

        // date: [year, month(1-12), day] for a live "days since" counter, or null for a static label
        const members = [
            { name: '刀ec[尺]o /A/', date: [2014,1,1], suffix: 'as Moderator', country: 'Amman, Jordan', rank: 'Owner & Moderator', color: 'amber' },
            { name: 'ღΒUFORD ツ', date: [2015,1,1], suffix: 'as Member', country: 'Saudi Arabia', rank: 'SUPPORTER', color: 'cyan' },
            { name: 'Mila', date: [2017,2,10], suffix: 'as ex Mod', country: 'Republic of Macedonia', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Natsheh', static: 'Since 2015', country: 'Tel Aviv, Palestine', rank: 'BARELY ACTIVE', color: 'blue' },
            { name: 'Razer', date: [2015,1,1], suffix: 'as Member', country: 'Philippines', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Hikmat', date: [2015,5,28], suffix: 'as Member', country: 'Palestine', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Zozo', date: [2015,6,1], suffix: 'as Member', country: 'Az Zarqa, Jordan', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Mka', static: 'Since 2016', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'GhAsSseNNN', static: 'Since 2016', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Admin X-Ran /A/', static: 'Since 2016', country: 'Amman, Jordan', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Explosion', static: 'Since 2017', country: 'Pakistan', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Ahmad', static: 'Since 2017', country: 'Palestine', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Killa', static: 'Since 2017', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'KaideN', static: 'Since 2017', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Rucker', static: 'Since 2017', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'LtRed', static: 'Since 2017', country: 'New Delhi, India', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Kusha', static: 'Since 2017', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'VåňBűřêň', static: 'Since 2017', country: 'Amman, Jordan', rank: 'INACTIVE', color: 'magenta' },
            { name: '7*A*M*O*D*A', date: [2017,7,7], suffix: 'as Admin', country: 'Palestine', rank: 'BARELY ACTIVE', color: 'cyansoft' },
            { name: 'Angel', static: 'Since 2018', country: 'Unknown', rank: 'INACTIVE', color: 'magenta' },
            { name: 'Ac!D^ ◕ ◡ ◕', date: [2018,3,27], suffix: 'as Member', country: 'Algeria', rank: 'INACTIVE', color: 'magenta' },
            { name: 'FiNe', date: [2018,4,1], suffix: 'as Member', country: 'Jeddah, Saudi Arabia', rank: 'INACTIVE', color: 'magenta' },
            { name: 'MrEagle', date: [2018,4,4], suffix: 'as Member', country: 'Stockholm, Sweden', rank: 'BARELY ACTIVE', color: 'cyansoft' },
            { name: 'jessi', date: [2018,6,5], suffix: 'as Admin', country: 'Palestine', rank: 'INACTIVE', color: 'magenta' },
            { name: 'ALSHABA71G', date: [2018,6,6], suffix: 'as Member', country: 'Palestine', rank: 'RETIRED', color: 'grey' },
            { name: 'AyZz', date: [2018,6,24], suffix: 'as Member', country: 'Palestine', rank: 'RETIRED', color: 'grey' },
            { name: 'Spix', date: [2018,7,26], suffix: 'as Member', country: 'Palestine', rank: 'RETIRED', color: 'grey' }
        ];

        const banned = [
            { name: 'Guccy', date: [2018,6,6], suffix: 'since application', country: 'France' },
            { name: '»™ALeXaNDeR™«', date: [2018,3,31], suffix: 'since application', country: 'Palestine' },
            { name: 'EFA', date: [2018,1,5], suffix: 'since application', country: 'Palestine' },
            { name: '|wHx| 1*1=11', date: [2016,6,7], suffix: 'since application', country: 'Amman, Jordan' }
        ];

        function daysSince(y, m, d) {
            const past = new Date(y, m - 1, d);
            const today = new Date();
            const diff = Math.round((today - past) / (24 * 60 * 60 * 1000));
            return diff;
        }

        function renderRow({ name, date, suffix, static: staticLabel, country, rank, color }) {
            const sinceText = date
                ? `${daysSince(...date).toLocaleString()} days ${suffix}`
                : staticLabel;
            return `
                <tr>
                    <td class="member-name">${name}</td>
                    <td class="member-since">${sinceText}</td>
                    <td class="member-country">${country}</td>
                    <td><span class="rank-tag" style="color:${RANK_COLORS[color]}">${rank}</span></td>
                </tr>`;
        }

        function renderBannedRow({ name, date, suffix, country }) {
            const sinceText = `${daysSince(...date).toLocaleString()} days ${suffix}`;
            return `
                <tr>
                    <td class="member-name">${name}</td>
                    <td class="member-since">${sinceText}</td>
                    <td class="member-country">${country}</td>
                    <td><span class="rank-tag" style="color:var(--magenta)">BANNED</span></td>
                </tr>`;
        }

        document.getElementById('membersBody').innerHTML = members.map(renderRow).join('');
        document.getElementById('bannedBody').innerHTML = banned.map(renderBannedRow).join('');

        // ===== Anti right-click & keyboard shortcut protection =====
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            const blocked =
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['i', 'j', 'c', 'k'].includes(key)) ||
                (e.metaKey && e.altKey && ['i', 'j', 'c'].includes(key)) ||
                ((e.ctrlKey || e.metaKey) && ['u', 's', 'p'].includes(key));
            if (blocked) e.preventDefault();
        });
        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>
</html>
